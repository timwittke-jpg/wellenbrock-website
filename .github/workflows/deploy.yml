# Baut die Seite bei jeder Änderung (z. B. Speichern im Pages CMS) und lädt sie per SFTP auf den Webspace.
# Benötigte Repository-Secrets (GitHub → Settings → Secrets and variables → Actions):
#   SFTP_HOST      z. B. 516171574.ssh.w1.strato.hosting
#   SFTP_USER      SFTP-Benutzer bei Strato
#   SFTP_PASSWORD  Passwort dieses SFTP-Benutzers
#   SFTP_PATH      Zielordner auf dem Webspace, z. B. timtestseite
# Optionale Repository-Variable BUILD_SCRIPT: "build:preview" (Testseite, nicht indexierbar, Standard) oder "build" (Livegang).
name: Bauen und hochladen

on:
  push:
    branches: [main]
  workflow_dispatch:

# Bei schnell aufeinanderfolgenden Änderungen nur den neuesten Stand hochladen
concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Seite bauen
        run: npm run ${{ vars.BUILD_SCRIPT || 'build:preview' }}

      - name: Per SFTP hochladen
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_USER: ${{ secrets.SFTP_USER }}
          LFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
          SFTP_PATH: ${{ secrets.SFTP_PATH }}
          OUT_DIR: ${{ (vars.BUILD_SCRIPT || 'build:preview') == 'build' && 'dist' || 'dist-preview' }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp
          # .htaccess und .htpasswd (Passwortschutz) auf dem Server bleiben unangetastet
          lftp --env-password -u "$SFTP_USER" "sftp://$SFTP_HOST" -e "
            set sftp:auto-confirm yes;
            set net:max-retries 3;
            mirror --reverse --verbose --parallel=4 --exclude-glob .ht* $OUT_DIR/ $SFTP_PATH/;
            bye"
